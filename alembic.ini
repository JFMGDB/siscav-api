[alembic]
# Migration scripts (revision files under apps/api/src/alembic/versions/).
script_location = apps/api/src/alembic

# PLACEHOLDER ONLY — not used at runtime. env.py resolves the URL via
# get_migration_database_url() (DATABASE_URL or app settings). See ADR 003 and 004.
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

