# Render Blueprint for SISCAV API (FastAPI).
# Database: external Supabase Postgres via DATABASE_URL (set in Render dashboard).
# Stable URL: assign a custom domain or use the default *.onrender.com service URL.
# Free Render services cannot attach persistent disks; uploaded files are ephemeral.
services:
  - type: web
    name: siscav-api
    runtime: python
    plan: free
    healthCheckPath: /api/v1/health
    # Slim runtime (no EasyOCR/torch — exceeds 512MB on free tier). OCR returns 503 on Render;
    buildCommand: pip install -r requirements.txt && pip install -r requirements-onnx.txt
    startCommand: uvicorn apps.api.src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /tmp/siscav-uploads
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: DEVICE_INGEST_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: VEHICLE_CLASSIFIER_BACKEND
        value: onnx
      - key: VEHICLE_CLASSIFIER_MODEL_PATH
        value: models/ambulance_classifier.onnx
      - key: VEHICLE_CLASSIFIER_THRESHOLD
        value: "0.85"
      - key: VEHICLE_CLASSIFIER_LABELS
        value: ambulance,other
      - key: VEHICLE_CLASSIFIER_INPUT_SIZE
        value: "224"
